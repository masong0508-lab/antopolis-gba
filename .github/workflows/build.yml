name: Build ROM
on: [push, pull_request, workflow_dispatch]
# A burst of rapid gameplay/UI commits should build the newest revision
# rather than queueing many obsolete ROMs and long emulator smoke runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4
      - run: make PREFIX=/opt/devkitpro/devkitARM/bin/arm-none-eabi-
        env: { PATH: "/opt/devkitpro/tools/bin:/usr/local/bin:/usr/bin:/bin" }
      - uses: actions/upload-artifact@v4
        with:
          name: empire-ants-gba
          path: |
            build/empire-ants.gba
            build/empire-ants.elf

  chase-logic:
    name: DUAL VIEW host logic regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test

  link-smoke:
    name: Two linked mGBA instances + 3D co-op
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: empire-ants-gba
          path: build
      - name: Install core build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential cmake pkg-config zlib1g-dev libpng-dev
      - name: Build dual-system link-capable mGBA core
        run: |
          git clone --depth 1 https://github.com/Spuds0588/mgba-splitscreen.git /tmp/antopolis-mgba
          cmake -S /tmp/antopolis-mgba -B /tmp/antopolis-mgba/build \
            -DCMAKE_BUILD_TYPE=Release -DLIBMGBA_ONLY=ON \
            -DBUILD_LIBRETRO_SPLITSCREEN=ON -DBUILD_LIBRETRO=OFF
          cmake --build /tmp/antopolis-mgba/build --target mgba_splitscreen_libretro --parallel 2
          find /tmp/antopolis-mgba/build -name 'mgba_splitscreen_libretro.so' -print
      - name: Exercise actual linked ROMs and verify both game achievements
        run: |
          CORE="$(find /tmp/antopolis-mgba/build -name mgba_splitscreen_libretro.so -print -quit)"
          test -n "$CORE"
          mkdir -p build/link-smoke
          # Save the exact native emulator and ROM for reproducible local
          # replay of a failed cable test without recompiling either one.
          cp "$CORE" build/link-smoke/linked-core.so
          cp build/empire-ants.gba build/link-smoke/empire-ants.gba
          cp build/empire-ants.elf build/link-smoke/empire-ants.elf
          python3 -u tools/linked_smoke.py build/empire-ants.gba "$CORE" --out build/link-smoke/classic --scenario co-op 2>build/link-smoke/classic-serial.log
          python3 -u tools/linked_smoke.py build/empire-ants.gba "$CORE" --out build/link-smoke/chase --scenario chase 2>build/link-smoke/chase-serial.log
          # Verify REAL 240x160 first-person pictures from both link roles.
          # No image dependencies; keep a JSON audit alongside screenshots.
          python3 tools/test_eye_screenshots.py \
            build/link-smoke/chase/06_cat_map_vs_mouse_eye.png \
            build/link-smoke/chase/11_roles_swapped.png \
            build/link-smoke/chase/eye_visual_audit.json
      - name: Verify maps, campaign and first-person gameplay
        run: |
          CORE=build/link-smoke/linked-core.so
          python3 -u tools/test_editor_roundtrip.py build/empire-ants.gba "$CORE" --out build/link-smoke/editor 2>build/link-smoke/editor-serial.log
          python3 -u tools/test_editor_roundtrip.py build/empire-ants.gba "$CORE" --tall --out build/link-smoke/editor-tall 2>build/link-smoke/editor-tall-serial.log
          python3 -u tools/test_campaign_menu.py build/empire-ants.gba "$CORE" --out build/link-smoke/campaign 2>build/link-smoke/campaign-serial.log
          python3 -u tools/test_colony_hud.py build/empire-ants.gba "$CORE" --out build/link-smoke/colony-hud 2>build/link-smoke/colony-hud-serial.log
          python3 -u tools/test_eye_missions.py build/empire-ants.gba "$CORE" --out build/link-smoke/eye-missions 2>build/link-smoke/eye-missions-serial.log
          python3 -u tools/test_eye_terrain.py build/empire-ants.gba "$CORE" --elf build/empire-ants.elf --out build/link-smoke/eye-terrain 2>build/link-smoke/eye-terrain-serial.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: antopolis-two-gba-link-test
          path: build/link-smoke
          if-no-files-found: warn
