name: Build ROM
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4
      - run: make PREFIX=/opt/devkitpro/devkitARM/bin/arm-none-eabi-
        env: { PATH: "/opt/devkitpro/tools/bin:/usr/local/bin:/usr/bin:/bin" }
      - uses: actions/upload-artifact@v4
        with: { name: empire-ants-gba, path: build/empire-ants.gba }
